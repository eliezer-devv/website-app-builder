name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Website URL"
        required: true
        type: string
      app_name:
        description: "Android app name"
        required: true
        type: string
      package_name:
        description: "Android package name"
        required: true
        type: string
      icon_path:
        description: "Uploaded app icon path"
        required: true
        type: string
      allowed_hosts:
        description: "Optional additional allowed hostnames, comma-separated"
        required: false
        type: string
      request_id:
        description: "Unique build ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out submitted build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate inputs and configure app
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ICON_PATH: ${{ inputs.icon_path }}
          ALLOWED_HOSTS_INPUT: ${{ inputs.allowed_hosts }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          url = os.environ["WEBSITE_URL"].strip()
          parsed = urlparse(url)

          if parsed.scheme not in ("http", "https") or not parsed.hostname:
              raise SystemExit("Invalid website URL")

          try:
              parsed.port
          except ValueError:
              raise SystemExit("Invalid website URL port")

          package = os.environ["PACKAGE_NAME"].strip()
          if not re.fullmatch(
              r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+",
              package
          ):
              raise SystemExit("Invalid Android package name")

          name = os.environ["APP_NAME"].strip()
          if not name or len(name) > 40 or "\n" in name:
              raise SystemExit("Invalid app name")

          if not re.fullmatch(r"[A-Za-z0-9._/-]+", os.environ["ICON_PATH"]):
              raise SystemExit("Invalid icon path")

          if not re.fullmatch(r"[0-9]+", os.environ["REQUEST_ID"]):
              raise SystemExit("Invalid build ID")

          if not os.path.isfile(os.environ["ICON_PATH"]):
              raise SystemExit("Uploaded icon was not found")

          hostname_pattern = re.compile(
              r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?"
              r"(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*"
          )

          hosts = set()
          raw_hosts = os.environ.get("ALLOWED_HOSTS_INPUT", "")

          for index, raw in enumerate(re.split(r"[\n,]+", raw_hosts), 1):
              host = raw.strip().lower()

              if not host or host.startswith("#"):
                  continue

              if not hostname_pattern.fullmatch(host):
                  raise SystemExit(
                      f"Invalid additional hostname: {host!r}. "
                      "Use a hostname only, without protocol, path, "
                      "port, or wildcard."
                  )

              hosts.add(host)

          configured_hosts = ",".join(sorted(hosts))

          with open("app-config.properties", "w", encoding="utf-8") as config:
              config.write("package_name=" + package + "\n")
              config.write("app_name=" + name.replace("\n", " ") + "\n")
              config.write("home_url=" + url + "\n")
              config.write("allowed_hosts=" + configured_hosts + "\n")

          print("Additional allowed hostnames:", len(hosts))
          for host in sorted(hosts):
              print("  " + host)
          PY

      - name: Generate app icons
        env:
          ICON_PATH: ${{ inputs.icon_path }}
        run: |
          set -euo pipefail
          cp "$ICON_PATH" webapp-icon.png
          python3 -m pip install --user Pillow
          python3 scripts/generate_icons.py

      - name: Build APK
        run: gradle assembleDebug

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || {
            echo "APK was not created at $APK"
            find app/build/outputs -type f -name '*.apk' || true
            exit 1
          }

          TAG="build-${REQUEST_ID}"

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${APP_NAME} APK" \
            --notes "Website wrapper APK built from the Website APK Builder form."

      - name: Delete temporary icon branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH_NAME" == web-build-* ]]; then
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_NAME}" \
              || echo "Temporary branch cleanup failed."
          fi
