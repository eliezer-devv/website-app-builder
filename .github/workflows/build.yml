name: Build Website APK

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == 'Build a website APK'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install image tools
        run: python3 -m pip install --quiet Pillow

      - name: Read build request and configure app
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          import os
          from pathlib import Path

          event_path = os.environ["GITHUB_EVENT_PATH"]
          event = json.loads(Path(event_path).read_text(encoding="utf-8"))
          body = event.get("issue", {}).get("body") or ""

          def field(label):
              pattern = (
                  r"(?ms)^###\s+" + re.escape(label) +
                  r"\s*\n(.*?)(?=^###\s+|\Z)"
              )
              match = re.search(pattern, body)

              if not match:
                  raise SystemExit(
                      f"Could not find form field: {label}\n"
                      f"Received issue body:\n{body}"
                  )

              value = match.group(1).strip()

              if value == "_No response_":
                  return ""

              return value

          url = field("Website URL").strip()
          name = field("App name").strip()
          package = field("Package name").strip()
          icon_url = field("App icon URL (optional)").strip()

          if url and not re.match(r"^https?://", url, re.IGNORECASE):
              url = "https://" + url

          print("Website URL received:", repr(url))
          print("App name received:", repr(name))
          print("Package name received:", repr(package))
          print("Custom icon provided:", bool(icon_url))

          if not re.fullmatch(r"https?://\S+", url, re.IGNORECASE):
              raise SystemExit(f"Invalid website URL: {url!r}")

          if not name or len(name) > 60:
              raise SystemExit(
                  "App name must contain between 1 and 60 characters."
              )

          if not re.fullmatch(
              r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+",
              package
          ):
              raise SystemExit(
                  f"Invalid Android package name: {package!r}"
              )

          if icon_url and not re.fullmatch(
              r"https?://\S+", icon_url, re.IGNORECASE
          ):
              raise SystemExit(
                  "Icon URL must begin with http:// or https://."
              )

          def escape_property(value):
              result = []

              for char in value:
                  code = ord(char)

                  if char == "\\":
                      result.append("\\\\")
                  elif char == "\n":
                      result.append("\\n")
                  elif char == "\r":
                      result.append("\\r")
                  elif char in "=:# !":
                      result.append("\\" + char)
                  elif code > 0xFFFF:
                      code -= 0x10000
                      result.append(
                          "\\u%04X\\u%04X" % (
                              0xD800 + (code >> 10),
                              0xDC00 + (code & 0x3FF)
                          )
                      )
                  elif code > 0x7E:
                      result.append(f"\\u{code:04X}")
                  else:
                      result.append(char)

              return "".join(result)

          config = (
              "package_name=" + escape_property(package) + "\n" +
              "app_name=" + escape_property(name) + "\n" +
              "home_url=" + escape_property(url) + "\n"
          )

          Path("app-config.properties").write_text(
              config, encoding="ascii"
          )

          Path("icon-url.txt").write_text(icon_url, encoding="utf-8")

          print("App configuration created successfully.")
          PY

      - name: Download and validate optional app icon
        shell: bash
        run: |
          set -euo pipefail

          ICON_URL="$(cat icon-url.txt)"

          # Do not accidentally reuse an old icon.
          rm -f webapp-icon.png icon-download.tmp

          if [ -z "$ICON_URL" ]; then
            echo "No custom icon provided; using the template icon."
            exit 0
          fi

          echo "Downloading custom app icon..."

          if ! curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --max-time 45 \
            --max-filesize 10485760 \
            --user-agent "WebsiteAppBuilder/1.0" \
            "$ICON_URL" \
            --output icon-download.tmp; then
            echo "::error::Icon download failed. Check that the URL is publicly accessible and points directly to an image."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, UnidentifiedImageError
          import sys

          source = Path("icon-download.tmp")
          output = Path("webapp-icon.png")

          if not source.exists() or source.stat().st_size == 0:
              sys.exit(
                  "Icon download was empty. Please provide a direct, "
                  "publicly accessible image URL."
              )

          try:
              with Image.open(source) as image:
                  image_format = image.format
                  image.verify()

              # Reopen after verify; verify() invalidates normal image reading.
              with Image.open(source) as image:
                  image.load()

                  if image.width < 1 or image.height < 1:
                      raise ValueError("Image has invalid dimensions.")

                  if image.width > 10000 or image.height > 10000:
                      raise ValueError(
                          "Image dimensions are too large; maximum is "
                          "10000 x 10000 pixels."
                      )

                  image = image.convert("RGBA")
                  image.save(output, format="PNG", optimize=True)

              print(
                  f"Icon validated and converted to PNG "
                  f"(original format: {image_format})."
              )

          except (UnidentifiedImageError, OSError, ValueError) as error:
              sys.exit(
                  "The icon URL did not provide a valid, supported image. "
                  "It may point to a webpage instead of an image, require "
                  "sign-in, or contain a damaged/unsupported file. "
                  f"Details: {error}"
              )
          PY

          rm -f icon-download.tmp

      - name: Generate launcher icons
        run: python3 scripts/generate_icons.py

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
