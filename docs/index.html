<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website APK Builder</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, Arial, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    main {
      max-width: 560px;
      margin: 20px auto;
      padding: 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #18274612;
    }

    h1 { margin-top: 0; font-size: 27px; }

    p {
      line-height: 1.5;
      color: #526078;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font: inherit;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #245eea;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 9px;
      background: #f0f3f8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #download {
      display: block;
      margin-top: 14px;
      font-weight: 700;
    }

    .hint { font-size: 13px; }
  </style>
</head>

<body>
<main>
  <h1>Website APK Builder</h1>
  <p>Enter a website and create an Android APK that opens it.</p>

  <form id="buildForm">
    <label for="website">Website URL</label>
    <input
      id="website"
      type="url"
      placeholder="https://example.com"
      required
    >

    <label for="appName">App name</label>
    <input
      id="appName"
      maxlength="40"
      placeholder="My Website"
      required
    >

    <label for="packageName">Package name</label>
    <input
      id="packageName"
      placeholder="com.example.mywebsite"
      pattern="[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+"
      required
    >
    <p class="hint">
      Use a unique package name, such as com.yourname.mywebsite.
    </p>

    <label for="icon">App icon</label>
    <input
      id="icon"
      type="file"
      accept="image/png,image/jpeg,image/webp"
      required
    >
    <p class="hint">
      Choose a square image if possible. PNG is recommended.
    </p>

    <button id="buildButton" type="submit">Build APK</button>
  </form>

  <div id="status" role="status">Ready to build.</div>
  <a id="download" hidden>Download APK</a>
</main>

<script>
(() => {
  // Do not put a live write-enabled token in a public website.
  // This placeholder intentionally prevents unauthenticated requests.
  const GITHUB_TOKEN = "PASTE_YOUR_GITHUB_TOKEN_HERE";

  const OWNER = "eliezer-devv";
  const REPO = "website-app-builder";
  const WORKFLOW = "build.yml";

  const form = document.getElementById("buildForm");
  const button = document.getElementById("buildButton");
  const status = document.getElementById("status");
  const download = document.getElementById("download");

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function api(path, options = {}) {
    const response = await fetch("https://api.github.com" + path, {
      ...options,
      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": "Bearer " + GITHUB_TOKEN,
        "X-GitHub-Api-Version": "2022-11-28",
        ...(options.headers || {})
      }
    });

    if (!response.ok) {
      const message = await response.text();
      throw new Error(
        "GitHub API error (" + response.status + "): " +
        message.slice(0, 500)
      );
    }

    if (response.status === 204) return null;
    return response.json();
  }

  function setStatus(message) {
    status.textContent = message;
  }

  function safePackageName(value) {
    return /^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$/.test(value);
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    download.hidden = true;

    // FIX: compare against the placeholder, not against the live token.
    if (
      !GITHUB_TOKEN ||
      GITHUB_TOKEN === "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"
    ) {
      setStatus(
        "GitHub authentication is not configured. " +
        "A public website cannot read repository secrets directly."
      );
      return;
    }

    const website = document.getElementById("website").value.trim();
    const appName = document.getElementById("appName").value.trim();
    const packageName = document.getElementById("packageName").value.trim();
    const iconFile = document.getElementById("icon").files[0];

    let parsedUrl;

    try {
      parsedUrl = new URL(website);
    } catch {
      setStatus("Enter a valid website URL.");
      return;
    }

    if (!["http:", "https:"].includes(parsedUrl.protocol)) {
      setStatus("The website URL must start with http:// or https://.");
      return;
    }

    if (!safePackageName(packageName)) {
      setStatus(
        "Enter a valid package name, such as com.example.mywebsite."
      );
      return;
    }

    if (!iconFile) {
      setStatus("Please choose an app icon.");
      return;
    }

    button.disabled = true;

    try {
      setStatus("Preparing your build…");

      const runId = Date.now().toString();
      const branch = "web-build-" + runId;

      const extension =
        iconFile.type === "image/jpeg" ? "jpg" :
        iconFile.type === "image/webp" ? "webp" : "png";

      const iconPath = "web-build-icons/icon-" + runId + "." + extension;

      const repo = await api(
        "/repos/" + OWNER + "/" + REPO
      );

      const baseBranch = repo.default_branch;

      const baseRef = await api(
        "/repos/" + OWNER + "/" + REPO +
        "/git/ref/heads/" + baseBranch
      );

      await api(
        "/repos/" + OWNER + "/" + REPO + "/git/refs",
        {
          method: "POST",
          body: JSON.stringify({
            ref: "refs/heads/" + branch,
            sha: baseRef.object.sha
          })
        }
      );

      setStatus("Uploading icon…");

      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(iconFile);
      });

      await api(
        "/repos/" + OWNER + "/" + REPO + "/contents/" + iconPath,
        {
          method: "PUT",
          body: JSON.stringify({
            message: "Upload icon for web build " + runId,
            content: base64,
            branch
          })
        }
      );

      setStatus("Starting Android build…");

      await api(
        "/repos/" + OWNER + "/" + REPO +
        "/actions/workflows/" + WORKFLOW + "/dispatches",
        {
          method: "POST",
          body: JSON.stringify({
            ref: branch,
            inputs: {
              website_url: website,
              app_name: appName,
              package_name: packageName,
              icon_path: iconPath,
              request_id: runId
            }
          })
        }
      );

      let run = null;

      for (let i = 0; i < 30; i++) {
        await sleep(2000);

        const runs = await api(
          "/repos/" + OWNER + "/" + REPO +
          "/actions/workflows/" + WORKFLOW +
          "/runs?branch=" + encodeURIComponent(branch) +
          "&per_page=10"
        );

        run = runs.workflow_runs.find(item =>
          item.event === "workflow_dispatch" &&
          new Date(item.created_at).getTime() >= Date.now() - 180000
        );

        if (run) break;
      }

      if (!run) {
        throw new Error(
          "The build did not appear. Check the Actions tab in GitHub."
        );
      }

      setStatus("Build started. Waiting for Android to finish…");

      while (true) {
        await sleep(5000);

        run = await api(
          "/repos/" + OWNER + "/" + REPO +
          "/actions/runs/" + run.id
        );

        if (run.status === "completed") break;

        setStatus("Build in progress…\nStatus: " + run.status);
      }

      if (run.conclusion !== "success") {
        throw new Error(
          "Build failed. Open the GitHub Actions run to see the logs:\n" +
          run.html_url
        );
      }

      setStatus("Build complete! Finding your APK…");

      let release = null;

      for (let i = 0; i < 15; i++) {
        await sleep(2000);

        const releases = await api(
          "/repos/" + OWNER + "/" + REPO + "/releases?per_page=20"
        );

        release = releases.find(
          item => item.tag_name === "build-" + runId
        );

        if (
          release &&
          release.assets.some(asset => asset.name.endsWith(".apk"))
        ) {
          break;
        }
      }

      if (!release) {
        throw new Error(
          "Build succeeded, but its APK release was not found."
        );
      }

      const apk = release.assets.find(
        asset => asset.name.endsWith(".apk")
      );

      if (!apk) {
        throw new Error("No APK was attached to the release.");
      }

      download.href = apk.browser_download_url;
      download.textContent = "Download " + appName + ".apk";
      download.hidden = false;

      setStatus("Your APK is ready.");
    } catch (error) {
      setStatus("Could not finish the build.\n" + error.message);
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
